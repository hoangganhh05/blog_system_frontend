    <meta name="theme-color" content="#6366f1" />

    <style>
      /* Mobile overlay touch fix (temporary) */
      @media (max-width: 768px) {
        .modal-overlay, .custom-toast, .loading-screen, .mobile-search-overlay, .floating-chat-widget {
          pointer-events: none !important;
          z-index: 9999 !important;
        }
        /* When overlays are visibly opened these classes should be present; allow interaction then */
        .modal-overlay.open, .loading-screen.active, .custom-toast.show, .mobile-search-overlay.open {
          pointer-events: auto !important;
        }
        /* Ensure main content accepts touch gestures */
        #root, #root * { touch-action: manipulation; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
